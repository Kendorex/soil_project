[package]
name = "aquacrop-core"
authors.workspace = true
description = "Numerically compatible AquaCrop computational core"
documentation = "https://docs.rs/aquacrop-core"
edition.workspace = true
keywords = ["agriculture", "crop-model", "simulation", "water"]
categories = ["science", "simulation"]
license.workspace = true
readme = "README.md"
rust-version.workspace = true
version.workspace = true

[features]
default = []
file-io = []
serde = ["dep:serde"]

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
thiserror = "2.0"

[dev-dependencies]
assertables = { workspace = true }
csv = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
yaml_serde = "0.10"

[[example]]
name = "official_fixture"
required-features = ["serde"]

[lints]
workspace = true
