[package]
name = "aquacrop-bmi"
authors.workspace = true
description = "Basic Model Interface (BMI) engine wrapping aquacrop-core, independent of any language binding"
edition.workspace = true
keywords = ["agriculture", "crop-model", "simulation", "bmi"]
categories = ["science", "simulation"]
license.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false

[dependencies]
aquacrop-core = { workspace = true, features = ["file-io"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
aquacrop-conformance.workspace = true

[lints]
workspace = true
