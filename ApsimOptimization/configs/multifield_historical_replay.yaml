# Historical 2019-2023 model evaluation. Values are copied only from the
# supplied APSIMX model, weather file, observation workbook, and the user's
# estimate of 0.2 ha per field. This file contains no price, soil-target, dose
# search-range, or fertilizer-ratio assumptions.
schema_version: 1
scenario:
  kind: historical_replay
  name: observed_rotation_and_n_labels_2019_2023
  recommendation_status: prohibited
  purpose: evaluate historical plausibility before optimization
model: ../simulation/calibrated/full_field2019_2023_calibrated_v3.apsimx
model_provenance: ../simulation/calibrated/full_field2019_2023_calibrated_v3.provenance.json
# Derived from the requested weather file by correcting its declared pressure
# unit and recalculating tav/amp from the unchanged daily temperatures. See the
# adjacent .provenance.json; the supplied source file remains untouched.
weather: ../data/weather/weather_2019_2023_units_corrected.met
weather_provenance: ../data/weather/weather_2019_2023_units_corrected.provenance.json
# The current user source contains complete rotation-manager parameters.
rotation_parameter_reference: null
output_dir: ../outputs/multifield/HISTORICAL_REPLAY
runtime:
  command:
    - /home/user/ApsimX/bin/Release/net8.0/Models
  timeout_seconds: 600
year: 2023
rotation_transition_policy: harvest_on_winter_sowing_proxy
historical_observations: ../data/observations/multifield_2019_2023.json
historical_replay:
  enabled: true
  nitrogen_source: technology_labels
  application_event: model_sowing_event_on_observed_date
  fertilizer_type: preserve_model
fields:
  Field1: {area_ha: 0.2}
  Field2: {area_ha: 0.2}
  Field3: {area_ha: 0.2}
  Field4: {area_ha: 0.2}
  Field5: {area_ha: 0.2}
  Field6: {area_ha: 0.2}
  Field7: {area_ha: 0.2}
  Field8: {area_ha: 0.2}
  Field9: {area_ha: 0.2}
  Field10: {area_ha: 0.2}
