schema_version: 1
scenario:
  kind: diagnostic
  name: historical_2023_n_with_residue_uncertainty
  recommendation_status: prohibited
  sources:
  - data/observations/historical_2022_2023.json
  - data/economics/fertilizer_prices.csv
  - data/economics/economic_constants.csv
  - outputs/multifield/DIAGNOSTIC_2023_N/baseline_6bb330dd7223/historical_comparison.json
  limitations:
  - P and K are absent because the APSIMX model has no responsive P/K pools.
  - Dose brackets reproduce the model dose and the N30/N60 historical labels.
  - Soil lower bounds reproduce the simulated 2023 baseline, not an agronomic norm.
  - Soil deviations are explored as objective 3 and are not hard constraints in this
    diagnostic.
  - Economics reuse old project proxies and must not support a farm decision.
  - Residue retention versus fresh-straw export is unresolved; all objectives use
    the worst scenario.
  diagnostic_subtype: uncertainty_ensemble
model: ../simulation/calibrated/full_field2019_2023_calibrated_v2.apsimx
model_provenance: ../simulation/calibrated/full_field2019_2023_calibrated_v2.provenance.json
weather: ../data/weather/weather_2019_2023_units_corrected.met
weather_provenance: ../data/weather/weather_2019_2023_units_corrected.provenance.json
environment_scenarios:
- name: documented_harvest_residue_retained
  model: ../simulation/scenarios/oats_2023_residue/documented_harvest_residue_retained.apsimx
  model_provenance: ../simulation/scenarios/oats_2023_residue/documented_harvest_residue_retained.provenance.json
- name: documented_harvest_fresh_straw_export
  model: ../simulation/scenarios/oats_2023_residue/documented_harvest_fresh_straw_export.apsimx
  model_provenance: ../simulation/scenarios/oats_2023_residue/documented_harvest_fresh_straw_export.provenance.json
scenario_aggregation:
  yield: worst_case
  profit: worst_case
  soil: worst_case
rotation_parameter_reference: null
output_dir: ../outputs/multifield/DIAGNOSTIC_2023_N_RESIDUE_ENSEMBLE
