calibration:
  cultivar: Zlata
  source_cultivar_name: Злата
  base_template: experiments/hydrology_v2/ensemble/top30_ll_q10_dul_q95p03.apsimx
  observations_workbook: docs/20260804_ВНИИМЗ_трансекта/20260804_ВНИИМЗ_трансекта.xlsx
  observations_sheet: Фенофазы
  technology_filter: N30
  years: [2023]
  calibration_years: []
  validation_years: [2023]
  weather_source: colleague_approved_open_meteo
  weather_files:
    2020: data/calibration_weather/weather_zlata_2020.met
    2021: data/calibration_weather/weather_zlata_2021.met
    2022: data/calibration_weather/weather_zlata_2022.met
    2023: data/calibration_weather/weather_zlata_2023.met
  work_dir: outputs/.hydrology_v2_top30_ll_q10_dul_q95p03_2023_screen_work
  output_dir: outputs/hydrology_v2_top30_ll_q10_dul_q95p03_2023_screen

  sowing_depth_mm: 30
  row_spacing_mm: 250
  population_source: seed_density_times_germination

  fertilizer:
    type_apsimx: NH4NO3N
    amount_kg_ha: 30
    status: provisional_product_form

  parameter_grid:
    MinLN:
      command: "[Phenology].CAMP.FLNparams.MinLN"
      values: [5.0]
    PpLN:
      command: "[Phenology].CAMP.FLNparams.PpLN"
      values: [2.5]
    BasePhyllochron:
      command: "[Phenology].Phyllochron.BasePhyllochron.FixedValue"
      values: [75.0]
    GrainFillingTarget:
      command: "[Phenology].GrainFilling.Target.FixedValue"
      allow_new_command: true
      values: [250.0]
    GrainRipeningTarget:
      command: "[Phenology].GrainRipening.Target.FixedValue"
      allow_new_command: true
      values: [100.0]

  selection:
    mode: maturity_upper_bound_then_heading
    observed_maturity_proxy: harvest_date_upper_bound

  diagnostic_report_expressions:
    - "[Wheat].Leaf.Fw as LeafFw"
    - "[Wheat].Leaf.Fn as LeafFn"
    - "[Wheat].Leaf.LAIDead as LeafLAIDead"
    - "[Wheat].Leaf.WaterDemand as LeafWaterDemand"
    - "[Wheat].Leaf.WaterAllocation as LeafWaterAllocation"
    - "[Wheat].Leaf.DMSupplyPhotosynthesis as LeafPhotosynthesis"
    - "[Wheat].Root.Depth as RootDepth"
    - "[Wheat].Root.WaterTensionFactor as RootWaterTensionFactor"
    - "[Wheat].Root.WaterUptake as RootWaterUptake"

  reporter:
    yield_source_unit: kg_per_ha
    stage_column: Wheat.Phenology.CurrentStageName
    zadok_column: Wheat.Phenology.Zadok.Stage
    heading_zadok_min: 50
    date_candidates: ["Date", "Today", "Clock.Today"]
    heading_stage_names: ["Heading", "HeadEmergence"]
    maturity_stage_names: ["Maturity", "HarvestRipe"]
