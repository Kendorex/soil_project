schema_version: 1
rotation_rules: ../data/rotation/rotation_transition_matrix.json

# Ретроспективный демонстрационный сценарий на полном интервале фактической
# погоды. 2019 год нужен для запуска состояния поля; целевые показатели APSIM
# на следующем этапе будут агрегироваться за 2020-2023 годы.
start_year: 2019
years: 5
minimum_transition_score: 0.5
top_k: 5
candidate_pool: 20000
farm_selection_beam_width: 5000

# Фактические предшественники 2018 года взяты из книги хозяйства. Поэтому
# переход 2018→2019 учитывается до формирования оставшейся последовательности.
initial_states:
  Field1: four_component_grass_mix_2018
  Field2: spring_wheat
  Field3: winter_rye
  Field4: oats_with_underseed
  Field5: mustard_2018
  Field6: perennial_grass_year2
  Field7: perennial_grass_year3
  Field8: perennial_grass_year1
  Field9: winter_rye
  Field10: perennial_grass_year2

# Основной сценарий ограничен четырьмя лучше всего обеспеченными культурами.
# Овёс с подсевом и последующие годы травостоя являются разными состояниями.
state_model:
  candidate_states:
    - winter_rye
    - spring_wheat
    - oats_with_underseed
  states:
    four_component_grass_mix_2018:
      name: Четырёхкомпонентная травосмесь (факт 2018)
      matrix_predecessor: clover
      forced_next: perennial_grass_year1
    mustard_2018:
      name: Горчица (факт 2018)
      # Горчицы нет в матрице почвоведов. История хозяйства содержит пять
      # переходов горчица→озимая рожь и один горчица→яровая пшеница.
      # Разрешаем только эти две подтверждённые основные культуры кодом И.
      source_allowed_next: [winter_rye, spring_wheat]
    winter_rye:
      name: Озимая рожь
      matrix_predecessor: winter_rye
      matrix_successor: winter_rye
    spring_wheat:
      name: Яровая пшеница
      matrix_predecessor: spring_wheat
      matrix_successor: spring_wheat
    oats_with_underseed:
      name: Овес с подсевом многолетних трав
      matrix_predecessor: oats
      matrix_successor: legume_cereal_mixture
      forced_next: perennial_grass_year1
    perennial_grass_year1:
      name: Многолетние травы 1-го года пользования
      matrix_predecessor: clover
      forced_next: perennial_grass_year2
    perennial_grass_year2:
      name: Многолетние травы 2-го года пользования
      matrix_predecessor: clover
      optional_continuations:
        - perennial_grass_year3
    perennial_grass_year3:
      name: Многолетние травы 3-го года пользования
      matrix_predecessor: clover

# Диапазоны взяты из фактической структуры десяти полей за 2019-2024 годы.
# Они только разрешают ничью между равноценными переходами и не объявляются
# нормативной структурой посевов. Горчица, рапс и отдельная вико-овсяная смесь
# не подменяются одной из четырёх культур.
farm_crop_mix:
  source:
    workbook: docs/20260804_ВНИИМЗ_трансекта/20260804_ВНИИМЗ_трансекта.xlsx
    sheet: Севооборот
    range: A219:C278
    years: 2019-2024
  categories:
    perennial_grass:
      states: [perennial_grass_year1, perennial_grass_year2, perennial_grass_year3]
      annual_min: 2
      annual_max: 5
      annual_target: 3.6666666667
    oats_with_underseed:
      states: [oats_with_underseed]
      annual_min: 1
      annual_max: 2
      annual_target: 1.6666666667
    winter_rye:
      states: [winter_rye]
      annual_min: 1
      annual_max: 2
      annual_target: 1.5
    spring_wheat:
      states: [spring_wheat]
      annual_min: 1
      annual_max: 2
      annual_target: 1.6666666667

evaluation:
  weather: ../data/weather/weather_2019_2023_units_corrected.met
  warmup_year: 2019
  objective_years: [2020, 2021, 2022, 2023]
  apsim_model: ../simulation/calibrated/full_field2019_2023_calibrated_v3.apsimx

limitations:
  - The 2018 predecessor is taken from the farm workbook for every field.
  - Field5 mustard is absent from the matrix; winter rye and spring wheat are allowed from documented farm transitions and marked with code И rather than assigned an invented matrix score.
  - The matrix scores only predecessor-to-successor compatibility.
  - The map has not yet been evaluated by APSIM or NSGA-II.
  - Yield, profit, and soil objectives will exclude the 2019 establishment year.
  - Mustard and rape are excluded because the supplied matrix does not score them.
  - Prices and agronomic soil thresholds are not confirmed; profit and soil objectives remain proxies.
  - Perennial-grass continuation states are derived from the documented farm rotation and are not scored as new sowings.
