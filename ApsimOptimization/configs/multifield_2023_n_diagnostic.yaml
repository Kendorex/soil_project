# Диагностический многополевой сценарий для проверки APSIM + NSGA-II.
# Диапазоны посева ограничены наблюдениями проекта и сохранёнными в исходной постановке
# агрономическими источниками; это ещё не производственная рекомендация.
schema_version: 1
scenario:
  kind: diagnostic
  name: historical_2023_multifield_management
  recommendation_status: prohibited
  sources:
    - data/observations/historical_2022_2023.json
    - data/economics/fertilizer_prices.csv
    - data/economics/economic_constants.csv
    - results/final_20261002/decision_readiness.json
  limitations:
    - P and K are absent because the APSIMX model has no responsive P/K pools.
    - Fertilizer dose is interpreted as kg of active N per hectare.
    - The optimizer tests 0--210 kg N/ha in discrete 30 kg N/ha steps.
    - Wheat cultivar choice applies only to the spring-wheat fields.
    - Oats fields retain the Oats+RedClover+PlantainForage group; optimizer sowing variables patch only Oats.
    - Oats objective yield counts oat grain only; undersown forage yield is not added.
    - Established 2023 perennial stands have no artificial sowing decision.
    - Rye is represented by the calibrated Winter_rye_smoke wheat-component proxy.
    - Soil lower bounds reproduce the simulated 2023 baseline, not an agronomic norm.
    - Soil deviations are explored as objective 3 and are not hard constraints in this diagnostic.
    - Economics reuse old project proxies and must not support a farm decision.
model: ../simulation/calibrated/full_field2019_2023_calibrated_v3.apsimx
model_provenance: ../simulation/calibrated/full_field2019_2023_calibrated_v3.provenance.json
weather: ../data/weather/weather_2019_2023_units_corrected.met
weather_provenance: ../data/weather/weather_2019_2023_units_corrected.provenance.json
environment_scenarios:
  - name: calibrated_baseline
scenario_aggregation: {yield: mean, profit: mean, soil: worst_case}
rotation_parameter_reference: null
output_dir: ../outputs/multifield/DIAGNOSTIC_2023_N
runtime:
  command:
    - Models
  timeout_seconds: 600
year: 2023
decision_period:
  start: '2022-09-01'
  end: '2023-12-31'
planning_mode: historical_fixed_rotation
# В двух переходах фактическая дата укоса неизвестна. Для диагностики биомасса
# убирается непосредственно перед известным посевом следующей озимой культуры.
rotation_transition_policy: harvest_on_winter_sowing_proxy
historical_observations: ../data/observations/historical_2022_2023.json
# Подтверждено только как воспроизводимый диагностический сценарий.
domain_values_confirmed: true
currency: RUB_DIAGNOSTIC_PROXY
yield_aggregation: total_harvest_dry_matter_kg
soil_constraint_mode: objective_only
nsga2:
  population: 8
  generations: 2
  seed: 42
fertilizer_options:
  UreaN_old_price_proxy:
    price_per_kg_product: 77.17
    components:
      - apsim_type: UreaN
        mass_fraction: 1.0
        apsim_amount_per_kg_product: 1.0
  NH4NO3N_old_price_proxy:
    price_per_kg_product: 69.77
    components:
      - apsim_type: NH4NO3N
        mass_fraction: 1.0
        apsim_amount_per_kg_product: 1.0
  UAN_N_old_price_proxy:
    price_per_kg_product: 110.94
    components:
      - apsim_type: UAN_N
        mass_fraction: 1.0
        apsim_amount_per_kg_product: 1.0
  NO3N_old_price_proxy:
    price_per_kg_product: 323.53
    components:
      - apsim_type: NO3N
        mass_fraction: 1.0
        apsim_amount_per_kg_product: 1.0
dose_ratios: []
reference_decision:
  Field1: {option: NO3N_old_price_proxy, dose_kg_product_ha: 0.0}
  Field2: {option: NO3N_old_price_proxy, dose_kg_product_ha: 30.0}
  Field3: {option: NO3N_old_price_proxy, dose_kg_product_ha: 30.0}
  Field4: {option: NO3N_old_price_proxy, dose_kg_product_ha: 0.0}
  Field5: {option: NO3N_old_price_proxy, dose_kg_product_ha: 30.0}
  Field6: {option: NO3N_old_price_proxy, dose_kg_product_ha: 0.0}
  Field7: {option: NO3N_old_price_proxy, dose_kg_product_ha: 30.0}
  Field8: {option: NO3N_old_price_proxy, dose_kg_product_ha: 30.0}
  Field9: {option: NO3N_old_price_proxy, dose_kg_product_ha: 30.0}
  Field10: {option: NO3N_old_price_proxy, dose_kg_product_ha: 0.0}
crop_economics:
  Wheat: &grain_proxy
    price_per_kg: 14.3
    marketable_kg_per_kg_dm: 1.0
  Oats: *grain_proxy
  RedClover: &unpriced_forage
    price_per_kg: 0.0
    marketable_kg_per_kg_dm: 1.0
  PlantainForage: *unpriced_forage

fields:
  Field1:
    area_ha: 0.2
    objective_yield_components: [RedClover, PlantainForage]
    product_economics: null
    fertilizer_options: [NO3N_old_price_proxy]
    dose_kg_product_ha: {min: 0.0, max: 0.0}
    application_dates: ['2023-05-01']
    application_depth_mm: 0.0
    application_cost_per_ha: 480.0
    other_cost_per_ha: 23000.0
    nutrients:
      - {name: mineral_n_end, expression: 'sum([NO3].kgha) + sum([NH4].kgha)', unit: kg/ha, depth_description: full APSIM soil profile, min: 39.427308970467195, max: null, normalization_scale: 39.427308970467195, period: date, date: '2023-12-31'}
  Field2:
    area_ha: 0.2
    objective_yield_components: [Oats]
    product_economics: null
    fertilizer_options: &annual_n_options [UreaN_old_price_proxy, NH4NO3N_old_price_proxy, UAN_N_old_price_proxy, NO3N_old_price_proxy]
    dose_kg_product_ha: &annual_n_doses {min: 0.0, max: 210.0, values: [0.0, 30.0, 60.0, 90.0, 120.0, 150.0, 180.0, 210.0]}
    application_dates: ['2023-05-04']
