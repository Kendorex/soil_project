calibration:
  cultivar: Zlata
  source_cultivar_name: Злата
  base_template: simulation/standart.apsimx
  observations_workbook: docs/20260804_ВНИИМЗ_трансекта/20260804_ВНИИМЗ_трансекта.xlsx
  observations_sheet: Фенофазы
  technology_filter: N30
  years: [2020, 2021, 2022, 2023]
  calibration_years: [2020, 2021, 2022]
  validation_years: [2023]
  weather_files:
    2020: data/calibration_weather/weather_zlata_2020.met
    2021: data/calibration_weather/weather_zlata_2021.met
    2022: data/calibration_weather/weather_zlata_2022.met
    2023: data/calibration_weather/weather_zlata_2023.met
  work_dir: outputs/.cultivar_calibration_work
  output_dir: outputs/cultivar_calibration

  # The exact field sowing date is forced in each calibration copy. Population
  # is estimated from seed density and laboratory germination; field emergence
  # was not measured and this value is therefore provisional.
  sowing_depth_mm: 30
  row_spacing_mm: 250
  population_source: seed_density_times_germination

  # The source table specifies N30 but not the fertiliser product. Ammonium
  # nitrate is a provisional engineering assumption and yield is not used as a
  # calibration target until the product and soil initial state are confirmed.
  fertilizer:
    type_apsimx: NH4NO3N
    amount_kg_ha: 30
    status: provisional_product_form

  # First-stage coarse phenology calibration. Only commands already present in
  # the Zlata cultivar node are changed. BasePhyllochron and vernalisation
  # parameters remain unchanged until the first diagnostic run is reviewed.
  parameter_grid:
    MinLN:
      command: "[Phenology].CAMP.FLNparams.MinLN"
      values: [6.0, 6.5, 7.0, 7.5, 8.0]
    PpLN:
      command: "[Phenology].CAMP.FLNparams.PpLN"
      values: [0.5, 1.0, 1.5, 2.0, 2.5]

  reporter:
    stage_column: Wheat.Phenology.CurrentStageName
    zadok_column: Wheat.Phenology.Zadok.Stage
    heading_zadok_min: 50
    date_candidates: ["Date", "Today", "Clock.Today"]
    heading_stage_names: ["Heading", "HeadEmergence"]
    maturity_stage_names: ["Maturity", "HarvestRipe"]
