# Обязательные агрономические и экономические значения заполняются пользователем.
# См. docs/MULTIFIELD.md. null не заменяется значениями из прежнего проекта.
schema_version: 1
model: ../simulation/calibrated/full_field2019_2023_calibrated_v2.apsimx
model_provenance: ../simulation/calibrated/full_field2019_2023_calibrated_v2.provenance.json
weather: ../data/weather/weather_2019_2023_units_corrected.met
weather_provenance: ../data/weather/weather_2019_2023_units_corrected.provenance.json
historical_readiness: ../outputs/multifield/HISTORICAL_REPLAY/current_decision_readiness.json
# Добавляйте подтверждённые варианты отдельными model/weather. Вероятности не
# предполагаются: mean означает равный вес, worst_case — худший сценарий.
environment_scenarios:
  - name: calibrated_baseline
scenario_aggregation: {yield: mean, profit: mean, soil: worst_case}
rotation_parameter_reference: null
output_dir: ../outputs/multifield
runtime:
  command:
  - /home/user/ApsimX/bin/Release/net8.0/Models
  timeout_seconds: 600
year: 2023
# Для урожая озимых 2023 года окно решений начинается осенью 2022 года.
# Границы включительны и должны лежать внутри Clock откалиброванной модели.
decision_period:
  start: '2022-09-01'
  end: '2023-12-31'
planning_mode: historical_fixed_rotation
# Требуется решение по двум конфликтам: поздний укос трав пересекается с более
# ранним посевом озимой ржи. Диагностический proxy описан в docs/MULTIFIELD.md.
rotation_transition_policy: null
historical_observations: ../data/observations/historical_2022_2023.json
domain_values_confirmed: false
currency: null
yield_aggregation: null
# hard: интервалы почвы являются ограничениями G <= 0 в производственной задаче.
soil_constraint_mode: hard
