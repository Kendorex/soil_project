schema_version: 1
scenario:
  kind: historical_diagnostic
  name: oats_2023_fertilizer_form_screen
  recommendation_status: prohibited
  purpose: quantify uncertainty from the unknown nitrogen fertilizer product
model: ../simulation/scenarios/oats_2023_residue/documented_harvest_fresh_straw_export.apsimx
model_provenance: ../simulation/scenarios/oats_2023_residue/documented_harvest_fresh_straw_export.provenance.json
weather: ../data/weather/weather_2019_2023_units_corrected.met
weather_provenance: ../data/weather/weather_2019_2023_units_corrected.provenance.json
rotation_parameter_reference: null
output_dir: ../outputs/multifield/OATS_FERTILIZER_FORM
runtime:
  command:
    - /home/user/ApsimX/bin/Release/net8.0/Models
  timeout_seconds: 600
year: 2023
rotation_transition_policy: harvest_on_winter_sowing_proxy
historical_observations: ../data/observations/multifield_2019_2023.json
historical_replay:
  enabled: true
  nitrogen_source: technology_labels
  application_event: model_sowing_event_on_observed_date
  fertilizer_type: preserve_model
fertilizer_form_screen:
  target_fields: [Field2, Field7]
  application_date: '2023-05-04'
  apsim_types: [NO3N, NH4NO3N, UreaN, UAN_N]
  dose_by_field_kg_n_ha: {Field2: 30.0, Field7: 60.0}
  amount_basis: explicit kg N/ha from supplied technology labels
  residue_endpoint: documented 2022 wheat harvest with fresh straw exported
fields:
  Field1: {area_ha: 0.2}
  Field2: {area_ha: 0.2}
  Field3: {area_ha: 0.2}
  Field4: {area_ha: 0.2}
  Field5: {area_ha: 0.2}
  Field6: {area_ha: 0.2}
  Field7: {area_ha: 0.2}
  Field8: {area_ha: 0.2}
  Field9: {area_ha: 0.2}
  Field10: {area_ha: 0.2}
